services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: homeserv
      POSTGRES_USER: homeserv
      POSTGRES_PASSWORD: homeserv
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://homeserv:homeserv@db:5432/homeserv
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
